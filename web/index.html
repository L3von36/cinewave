<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B0D12">
  <meta name="description" content="CineWave — a cinematic streaming experience built with Flutter and Material 3.">
  <title>CineWave</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; background: #0B0D12; height: 100%; overflow: hidden; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: system-ui, sans-serif; color: #E8EAF2;
    }
    #boot .mark {
      width: 64px; height: 64px; border-radius: 20px;
      background: linear-gradient(135deg, #7C6CFF, #22D3EE);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 40px rgba(124, 108, 255, .35);
    }
    #boot .mark span {
      width: 0; height: 0; margin-left: 5px;
      border-left: 18px solid #0B0D12;
      border-top: 11px solid transparent;
      border-bottom: 11px solid transparent;
    }
    #boot .bar { width: 132px; height: 3px; border-radius: 3px; overflow: hidden; background: #1E222D; }
    #boot .bar i {
      display: block; height: 100%; width: 40%; border-radius: 3px;
      background: linear-gradient(90deg, #7C6CFF, #22D3EE);
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(330%); } }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mark"><span></span></div>
    <div class="bar"><i></i></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
